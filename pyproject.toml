[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "beamfix"
version = "0.4.1"
description = "Local-first Linux display diagnostics"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beamfix = "beamfix.cli:main"
beamfix-gui = "beamfix.gui:main"

[tool.setuptools.packages.find]
include = ["beamfix*"]

[tool.setuptools.package-data]
beamfix = ["LICENSE.txt", "NOTICE.txt", "web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
