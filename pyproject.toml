[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamfix"
version = "0.4.0"
description = "Local-first Linux display diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beamfix = "beamfix.cli:main"
beamfix-gui = "beamfix.gui:main"

[tool.setuptools.packages.find]
include = ["beamfix*"]

[tool.setuptools.package-data]
beamfix = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
