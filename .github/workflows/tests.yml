name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated D-Bus test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus systemd python3-gi
      - name: Run diagnostic and recovery tests
        env:
          BEAMFIX_REQUIRE_DBUS_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify package installation and entry point
        run: |
          python -m pip install .
          cd /tmp
          beamfix --version
